# CatchUP Production Load Balancer, Connection Pool, Compression & Edge Cache
upstream catchup_app_pool {
    least_conn;
    server 127.0.0.1:8080 max_fails=3 fail_timeout=15s weight=1;
    server 127.0.0.1:8081 backup;
    # Upstream keepalive connection pool
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 65s;
}

proxy_cache_path /var/cache/nginx/catchup_edge
    levels=1:2
    keys_zone=catchup_server_cache:32m
    max_size=1g
    inactive=60m
    use_temp_path=off;

server {
    listen 80;
    server_name catchup.ph www.catchup.ph localhost;

    # Payload Compression (Gzip)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/javascript
        application/json
        application/wasm
        text/css
        text/javascript
        text/plain
        image/svg+xml;

    # Immutable CDN & Server-Side Caching for Code Chunks (.part.js), WASM, Fonts & Images
    location ~* \.(?:js|wasm|css|png|jpg|jpeg|webp|svg|woff2|ttf|ico)$ {
        proxy_pass http://catchup_app_pool;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache catchup_server_cache;
        proxy_cache_valid 200 365d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header Cache-Control "public, max-age=31536000, s-maxage=31536000, immutable" always;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Application Shell & API Routing with Server-Side Micro-Caching
    location / {
        proxy_pass http://catchup_app_pool;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        proxy_cache catchup_server_cache;
        proxy_cache_valid 200 1m;
        proxy_cache_lock on;
        proxy_cache_background_update on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header Cache-Control "public, max-age=60, stale-while-revalidate=86400" always;
        add_header X-Cache-Status $upstream_cache_status always;
    }
}

