<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="CatchUP — Seafood Inventory & Stock Management System for Roxas City, Capiz.">
  <meta name="theme-color" content="#0A2E52">
  <meta http-equiv="Cache-Control" content="public, max-age=300, stale-while-revalidate=86400">

  <!-- CDN Preconnect & DNS-Prefetch Hints -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
  <link rel="dns-prefetch" href="https://www.gstatic.com">
  <link rel="dns-prefetch" href="https://firestore.googleapis.com">
  <link rel="dns-prefetch" href="https://firebasestorage.googleapis.com">

  <!-- iOS & PWA meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CatchUP">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>CatchUP — Seafood Inventory Management</title>
  <link rel="manifest" href="manifest.json">

  <!-- Minified Critical First-Paint CSS & Skeleton Shimmer -->
  <style>
    html,body{margin:0;padding:0;height:100%;background-color:#FAF7F2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
    #catchup-loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background-color:#FAF7F2;z-index:99999;contain:strict;will-change:opacity;transition:opacity .22s ease}
    .catchup-wordmark{font-size:28px;font-weight:900;letter-spacing:-.5px;margin-top:8px}
    .catchup-wordmark .catch{color:#0A2E52}
    .catchup-wordmark .up{color:#0696C7;font-style:italic}
    .catchup-tagline{color:#0A2E52;font-size:9px;font-weight:700;letter-spacing:1.4px;margin-top:4px}
    .catchup-loading-text{color:#0B3556;font-size:15px;font-weight:700;letter-spacing:.6px;margin-top:16px}
    .catchup-skeleton-bar{width:140px;height:4px;border-radius:4px;background:rgba(10,46,82,.1);overflow:hidden;margin-top:12px;position:relative}
    .catchup-skeleton-bar::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#0696C7,transparent);animation:catchup-shimmer 1.1s infinite}
    @keyframes catchup-shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
  </style>
</head>
<body>
  <div id="catchup-loader" role="status" aria-live="polite" aria-label="Loading CatchUP">
    <svg width="110" height="72" viewBox="0 0 155 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M55.8 88C29.4 65 37.2 22 69.7 11C79 8 86.8 10 91.4 14C88.3 32 75.9 44 62 49C49.6 56 48 72 55.8 88Z" stroke="#0A2E52" stroke-width="6.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M48 31L35.6 24Q48 16 58.9 17Z" fill="#0A2E52"/>
      <path d="M68.2 45L66.6 58L77.5 43Z" fill="#0A2E52"/>
      <circle cx="76" cy="22" r="4.2" fill="#0A2E52"/>
      <path d="M91.4 53L97.6 24Q99.2 20 105.4 21L128.6 25Q134.8 26 133.3 31L127.1 61" stroke="#0A2E52" stroke-width="6.8" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="106" y="17.5" width="20" height="9" rx="4" fill="#0A2E52"/>
      <circle cx="116.2" cy="16" r="4" stroke="#0A2E52" stroke-width="5.5"/>
      <path d="M100.7 36L103.8 39L110 34" stroke="#0A2E52" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="114.7" y1="37" x2="125.5" y2="39" stroke="#0A2E52" stroke-width="4.8" stroke-linecap="round"/>
      <path d="M99.2 47L102.3 50L108.5 45" stroke="#0A2E52" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="113.1" y1="48" x2="124" y2="50" stroke="#0A2E52" stroke-width="4.8" stroke-linecap="round"/>
      <path d="M55.8 79C74.4 56 96.1 58 114.7 67C124 71 131.7 71 139.5 68C127.1 82 106.9 83 88.3 74C75.9 69 65.1 72 55.8 79Z" fill="#0696C7"/>
      <path d="M55.8 85C69.7 73 86.8 76 113.1 87C99.2 93 85.2 89 71.3 94C65.1 96 60.4 91 55.8 85Z" fill="#0C699E"/>
    </svg>
    <div class="catchup-wordmark"><span class="catch">Catch</span><span class="up">UP</span></div>
    <div class="catchup-tagline">EVERY CATCH COUNTS. EVERY STOCK MATTERS.</div>
    <div class="catchup-loading-text">Loading...</div>
    <div class="catchup-skeleton-bar"></div>
  </div>
  <!-- Deferred Non-Critical Loader Cleanup & Bootstrap Scripts -->
  <script defer>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('catchup-loader');
      if (loader) {
        loader.remove();
      }
    }, { once: true, passive: true });
  </script>
  <script src="flutter_bootstrap.js" defer></script>
</body>
</html>
